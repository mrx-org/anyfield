name: CI

on:
  push:
    branches: [mcp-redesign, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6

      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    # The study deploys from its branch; move to main once it is adopted.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/mcp-redesign'
    runs-on: ubuntu-latest
    concurrency: deploy-modal
    env:
      # Tokens of the Modal workspace mrx-org (repository secrets)
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: astral-sh/setup-uv@v6
      - name: Deploy to Modal
        working-directory: backend
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then
            echo "::warning::MODAL_TOKEN_ID/MODAL_TOKEN_SECRET not set - skipping deploy"
            exit 0
          fi
          uv sync --locked --no-dev
          uv run --no-dev modal deploy -m anyfield.modal_app
          # The modal.run URL the Cloudflare worker must forward app.anyfield.net to
          url=$(uv run --no-dev python -c 'import modal; print(modal.Function.from_name("anyfield", "web").get_web_url())')
          echo "Modal web URL: $url"
          echo "Modal web URL: <$url> (target of the Cloudflare worker for app.anyfield.net)" >> "$GITHUB_STEP_SUMMARY"
