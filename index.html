<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Any-Field Scanner</title>
    
    <!-- Dependencies for Niivue App -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
    
    <!-- CSS Loading Order: Base styles first, then modules, then master override -->
    <link rel="stylesheet" href="startup.css">
    <link rel="stylesheet" href="niivue_app.css?v=5">
    <link rel="stylesheet" href="pypulseq/seq_explorer.css">
    <link rel="stylesheet" href="scan_zero/scan_module.css?v=2">

    <!-- Dependencies for Seq Explorer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">

    <style>
        :root {
            /* Unified color system - single background hierarchy */
            --bg: #0a0e1a;              /* Base background - darkest */
            --bg-elevated: #0f1424;     /* Slightly elevated surfaces */
            --bg-panel: #141b2d;        /* Panel/card background */
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text: #e8ecff;
            --muted: #a9b3da;
            --sidebar-width: 260px;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        
        .lab-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            justify-content: space-between;
        }

        .lab-grid {
            flex: 1;
            display: grid;
            grid-template-areas:
                "sidebar main"
                "footer footer";
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 1fr 320px;
            overflow: hidden;
            position: relative;
        }
        /* Loader overlays right side of main (B, and B+C when compare pane active) */
        .loading-overlay.main-area-loader {
            grid-area: main;
            position: absolute;
            left: 50%;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
        }
        #slot-main.has-compare-pane .loading-overlay.main-area-loader {
            left: 33.33%;
        }
        #nv-preview-bc-stack {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }
        #nv-preview-bc-canvas-row {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: row;
        }
        #nv-preview-bc-canvas-row > .niivue-app {
            flex: 1;
            min-width: 0;
            min-height: 0;
        }
        #nv-joint-hist-row {
            flex: 0 0 auto;
        }
        #nv-compare-container {
            flex: 1;
            min-width: 0;
            min-height: 0;
            border-left: 1px solid var(--border);
            flex-direction: column;
        }
        #nv-compare-container.compare-pane-hidden {
            display: none !important;
        }
        #slot-main > .niivue-app,
        #slot-main > #nv-preview-bc-stack {
            min-width: 0;
        }
        #slot-main:not(.planning-hist-visible) .clim-hist-panel,
        #slot-main:not(.planning-hist-visible) #nv-joint-hist-row {
            display: none !important;
        }
        .footer-wrapper.footer-pending {
            display: none !important;
        }
        #nv-viewer-container.viewer-waiting-demo {
            visibility: hidden;
        }
        .lab-grid.sidebar-collapsed {
            grid-template-columns: 30px 1fr;
        }

        #slot-sidebar { 
            grid-area: sidebar; 
            border-right: 1px solid var(--border); 
            border-bottom: 1px solid var(--border); 
            overflow-y: auto; 
            background: var(--bg-elevated); 
        }
        #slot-sidebar.sidebar-collapsed {
            min-width: 0;
            width: 100%;
            overflow: hidden;
        }
        #slot-sidebar.sidebar-collapsed .tabs-header {
            flex-direction: column;
            flex-wrap: nowrap;
        }
        #slot-sidebar.sidebar-collapsed .tab-btn {
            flex: 0 0 auto;
            min-height: 34px;
        }
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="phantoms"],
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="view"],
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="fov"] {
            display: none;
        }
        #slot-main { 
            grid-area: main; 
            border-bottom: 1px solid var(--border); 
            overflow: hidden; 
            position: relative; 
            background: var(--bg);
        }
        #slot-main.scrollable { overflow-y: auto; }
        
        .footer-wrapper {
            grid-area: footer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .footer-wrapper .footer-card-dots { display: none; }
        #slot-footer { 
            flex: 1;
            min-height: 0;
            display: grid; 
            grid-template-columns: 1fr 0.8fr 1.5fr; 
            gap: 1px; 
            background: var(--border); 
            overflow: hidden; 
        }
        .footer-col { 
            background: var(--bg-elevated); 
            overflow-y: auto; 
            padding: 12px; 
            position: relative; 
        }

        /* Tab Styles for Sidebar */
        .tabbed-controls {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .tabs-header {
            display: flex;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            background: var(--bg-elevated);
        }
        .tabs-content {
            flex: 1;
            overflow: hidden;
            padding: 2px;
            display: flex;
            flex-direction: column;
            background: var(--bg-elevated);
        }
        .tabs-content.panel-collapsed {
            display: none !important;
        }
        .tab-pane {
            display: none;
            height: 100%;
            overflow: hidden;
        }
        .tab-pane.active {
            display: flex;
            flex-direction: column;
        }

        /* Module Styles Override */
        .niivue-app, .standalone-viewer, .standalone-controls {
            height: 100% !important;
            width: 100% !important;
            background: transparent !important;
        }
        .seq-plot-container {
            height: 100% !important;
            background: var(--bg) !important;
        }
        #slot-footer .seq-explorer, #slot-footer .scan-module {
            height: 100%;
            background: transparent;
        }
    </style>
    <link rel="stylesheet" href="no_field_mobile.css" media="(max-width: 768px)">
</head>

    <script type="module" src="paper_plot/launch.js?v=11"></script>
    <script type="module">
        import { NiivueModule, ScanPreviewModule, ComparePane, syncPreviewViewerClims } from './niivue_app.js';
        import { MainHistogramController, PreviewJointHistogramController } from './hist_panel/histogram-clim-panel.js';
        import { SequenceExplorer, patchSequencePlotFromCode } from './pypulseq/seq_explorer.js';
        import { ScanModule } from './scan_zero/scan_module.js?v=10';
        import { eventHub } from './event_hub.js';

        // URL flags: ?pro=1 pro/debug; readable deep link ?s_category=&s_file=&s_func= or legacy ?init_prot=; ?seq_url= remote .seq
        const urlParams = new URLSearchParams(window.location.search);
        window.pro = /^1|true|yes$/i.test(urlParams.get('pro') || '');
        document.documentElement.classList.toggle('pro-user', window.pro);
        const sCat = (urlParams.get('s_category') || '').trim();
        const sFile = (urlParams.get('s_file') || '').trim();
        const sFunc = (urlParams.get('s_func') || '').trim();
        const hasSplitInit = sCat !== '' && sFile !== '' && sFunc !== '';
        const initialProtFromSplit = hasSplitInit ? `${sCat}/${sFile}:${sFunc}` : undefined;
        const initialProtRaw = urlParams.get('init_prot');
        const initialProtFromLegacy =
            initialProtRaw != null && String(initialProtRaw).trim() !== '' ? String(initialProtRaw).trim() : undefined;
        const initialSeqUrl = (urlParams.get('seq_url') || '').trim();
        let initialSeqParams = null;
        for (const [key, val] of urlParams) {
            if (!key.startsWith('sp_')) continue;
            if (!initialSeqParams) initialSeqParams = {};
            const name = key.slice(3);
            let parsed;
            if (val === 'true') parsed = true;
            else if (val === 'false') parsed = false;
            else if (val.startsWith('[')) { try { parsed = JSON.parse(val); } catch(e) { parsed = val; } }
            else parsed = isNaN(val) || val === '' ? val : Number(val);
            initialSeqParams[name] = parsed;
        }
        let initialProt = initialProtFromSplit ?? initialProtFromLegacy;
        if (initialSeqUrl && !initialProt) {
            initialProt = 'anyseq/seq_pulseq_interpreter:seq_pulseq_interpreter';
        }

        class ViewManager {
            constructor(nvModule, seqExplorer, scanModule, scanPreview) {
                this.nv = nvModule;
                this.seq = seqExplorer;
                this.scan = scanModule;
                this.preview = scanPreview;
                this.currentMode = null;
                this.maximizedViewer = null; // null | nvViewer | nvScanPreview | nvCompare
                this.compareActive = false;
                this.slots = {
                    sidebar: document.getElementById('slot-sidebar'),
                    main: document.getElementById('slot-main'),
                    tree: document.getElementById('col-tree'),
                    scan: document.getElementById('col-scan'),
                    params: document.getElementById('col-params')
                };
                this.cache = {
                    nvViewer: document.getElementById('nv-viewer-container'),
                    nvPreviewBcStack: document.getElementById('nv-preview-bc-stack'),
                    nvScanPreview: document.getElementById('nv-scan-preview-container'),
                    nvCompare: document.getElementById('nv-compare-container'),
                    nvControls: document.getElementById('nv-controls-container'),
                    seqTree: document.getElementById('seq-tree-container'),
                    seqParams: document.getElementById('seq-params-container'),
                    seqPlot: document.getElementById('seq-plot-container'),
                    scanModule: document.getElementById('scan-module-container')
                };
                
                // Listen for toggle maximize events
                eventHub.on('toggleViewerMaximize', ({ containerId }) => {
                    this.toggleViewerMaximize(containerId);
                });
            }

            bindViewModeButtons() {
                document.getElementById('view-mode-planning-btn')?.addEventListener('click', () => {
                    if (this.compareActive) this.deactivateCompareColumn();
                    this.setMode('planning');
                });
                document.getElementById('view-mode-compare-btn')?.addEventListener('click', () => {
                    this.setMode('planning');
                    this.activateCompareColumn();
                });
                document.getElementById('view-mode-sequence-btn')?.addEventListener('click', () => {
                    if (this.currentMode !== 'sequence') {
                        this.setMode('sequence');
                    }
                    this.seq?.executeFunction?.();
                });
                this.syncViewModeButtons();
            }

            syncViewModeButtons() {
                const planningBtn = document.getElementById('view-mode-planning-btn');
                const compareBtn = document.getElementById('view-mode-compare-btn');
                const sequenceBtn = document.getElementById('view-mode-sequence-btn');
                const compare = !!this.compareActive;
                planningBtn?.classList.toggle('is-active', this.currentMode === 'planning' && !compare);
                compareBtn?.classList.toggle('is-active', this.currentMode === 'planning' && compare);
                sequenceBtn?.classList.toggle('is-active', this.currentMode === 'sequence');
            }
            
            toggleViewerMaximize(containerId) {
                if (this.currentMode !== 'planning') return;
                
                // Determine which viewer was double-tapped
                let tappedViewer = null;
                if (containerId === 'nv-viewer-container') tappedViewer = 'nvViewer';
                else if (containerId === 'nv-scan-preview-container') tappedViewer = 'nvScanPreview';
                else if (containerId === 'nv-compare-container') tappedViewer = 'nvCompare';
                else return;
                
                // Toggle logic
                if (this.maximizedViewer === tappedViewer) {
                    // Already maximized - restore both
                    this.maximizedViewer = null;
                } else {
                    // Maximize the tapped viewer
                    this.maximizedViewer = tappedViewer;
                }
                
                // Apply the layout
                this.applyViewerLayout();
            }
            
            activateCompareColumn() {
                this.compareActive = true;
                this.maximizedViewer = null;
                const compare = this.cache.nvCompare;
                const main = this.slots.main;
                if (compare) {
                    compare.classList.remove('compare-pane-hidden');
                    compare.style.display = 'flex';
                    compare.style.flex = '1';
                    compare.style.minWidth = '0';
                    compare.style.minHeight = '0';
                }
                if (main) main.classList.add('has-compare-pane');
                ComparePane.ensureEmptyPlaceholder(compare);
                if (this.currentMode === 'planning') {
                    this.applyViewerLayout();
                }
                this.syncViewModeButtons();
            }

            deactivateCompareColumn() {
                this.compareActive = false;
                if (this.maximizedViewer === 'nvCompare') {
                    this.maximizedViewer = null;
                }
                const compare = this.cache.nvCompare;
                if (compare) {
                    compare.classList.add('compare-pane-hidden');
                    compare.style.display = 'none';
                }
                this.slots.main?.classList.remove('has-compare-pane');
                if (this.currentMode === 'planning') {
                    this.applyViewerLayout();
                }
                this.syncViewModeButtons();
            }

            applyViewerLayout() {
                const viewer = this.cache.nvViewer;
                const bcStack = this.cache.nvPreviewBcStack;
                const preview = this.cache.nvScanPreview;
                const compare = this.cache.nvCompare;
                const three = this.compareActive;
                const border = '1px solid var(--border)';

                const showCol = (el, flexGrow = '1') => {
                    if (!el) return;
                    el.style.display = 'flex';
                    el.style.flex = flexGrow;
                    el.style.minWidth = '0';
                    el.style.minHeight = '0';
                    el.style.flexDirection = 'column';
                };
                const hideCol = (el) => {
                    if (el) el.style.display = 'none';
                };
                const showInner = (el) => {
                    if (!el) return;
                    el.style.display = 'flex';
                    el.style.flex = '1';
                    el.style.minWidth = '0';
                    el.style.minHeight = '0';
                    el.style.flexDirection = 'column';
                };
                const hideInner = (el) => {
                    if (el) el.style.display = 'none';
                };

                if (this.maximizedViewer === 'nvViewer') {
                    showCol(viewer);
                    hideCol(bcStack);
                } else if (this.maximizedViewer === 'nvScanPreview') {
                    hideCol(viewer);
                    showCol(bcStack);
                    showInner(preview);
                    hideInner(compare);
                    if (bcStack) bcStack.style.borderLeft = 'none';
                } else if (this.maximizedViewer === 'nvCompare') {
                    hideCol(viewer);
                    showCol(bcStack);
                    hideInner(preview);
                    showInner(compare);
                    ComparePane.ensureEmptyPlaceholder(compare);
                    if (compare) compare.style.borderLeft = 'none';
                    if (bcStack) bcStack.style.borderLeft = 'none';
                } else {
                    showCol(viewer);
                    showCol(bcStack, three ? '2' : '1');
                    if (bcStack) bcStack.style.borderLeft = border;
                    showInner(preview);
                    if (three) {
                        showInner(compare);
                        if (compare) {
                            compare.classList.remove('compare-pane-hidden');
                            compare.style.borderLeft = border;
                            ComparePane.ensureEmptyPlaceholder(compare);
                        }
                    } else {
                        hideInner(compare);
                        if (compare) compare.classList.add('compare-pane-hidden');
                    }
                }

                setTimeout(() => {
                    if (this.nv?.nv && viewer?.style.display !== 'none') {
                        this.nv.nv.resizeListener();
                    }
                    if (this.preview?.nv && preview?.style.display !== 'none') {
                        this.preview.nv.resizeListener();
                    }
                    const cmpNv = window.scanCompare?.module?.nv;
                    if (cmpNv && compare?.style.display !== 'none') {
                        cmpNv.resizeListener();
                    }
                    syncPreviewViewerClims();
                    window.mainHist?.scheduleRefresh?.();
                }, 50);
            }

            moveToSlot(moduleName, slotName) {
                const content = this.cache[moduleName];
                const slot = this.slots[slotName];
                if (content && slot) {
                    slot.appendChild(content);
                }
            }

            setMode(mode, autoPlot = false) {
                console.log('Switching to mode:', mode);
                this.currentMode = mode;
                
                // Clear slots
                this.slots.sidebar.innerHTML = '';
                this.slots.main.innerHTML = '';
                this.slots.tree.innerHTML = '';
                this.slots.scan.innerHTML = '';
                this.slots.params.innerHTML = '';

                // Always fixed parts
                this.moveToSlot('nvControls', 'sidebar');
                this.moveToSlot('seqTree', 'tree');
                this.moveToSlot('scanModule', 'scan');
                this.moveToSlot('seqParams', 'params');

                if (mode === 'planning') {
                    this.slots.main.style.display = 'flex';
                    this.slots.main.style.flexDirection = 'row';
                    this.slots.main.classList.add('planning-hist-visible');
                    this.moveToSlot('nvViewer', 'main');
                    this.moveToSlot('nvPreviewBcStack', 'main');
                    this.slots.main.classList.remove('scrollable');
                    this.applyViewerLayout();
                } else if (mode === 'sequence') {
                    this.slots.main.classList.remove('planning-hist-visible');
                    // Reset maximize state when leaving planning mode
                    this.maximizedViewer = null;
                    // Full width for sequence plot
                    this.slots.main.style.display = '';
                    this.slots.main.style.flexDirection = '';
                    this.moveToSlot('seqPlot', 'main');
                    this.slots.main.classList.add('scrollable');
                    
                    // Trigger plot if requested and not already plotting
                    if (autoPlot && this.seq && this.seq.selectedSequence) {
                        this.seq.executeFunction();
                    }
                }
                
                // Notify Niivue to resize
                if (this.nv && this.nv.nv) {
                    setTimeout(() => {
                        this.nv.nv.resizeListener();
                        // Force grid layout again after resize
                        if (typeof this.nv.nv.setMultiplanarLayout === 'function') {
                            this.nv.nv.setMultiplanarLayout(2); // GRID
                        }
                    }, 50);
                }
                if (this.preview && this.preview.nv) {
                    setTimeout(() => {
                        this.preview.nv.resizeListener();
                    }, 50);
                }
                this.syncViewModeButtons();
            }
        }

        async function bootstrap() {
            try {
                // Prefetch plot utils while Pyodide downloads (patch runs inside pyodidePromise, under loader).
                const plotUtilsFetch = fetch(`pypulseq/seq_plot_utils.py?${Date.now()}`).then(async (r) => {
                    if (!r.ok) throw new Error(`seq_plot_utils.py: ${r.status}`);
                    return r.text();
                });

                // A. START PYODIDE & PACKAGES IN BACKGROUND (do not await)
                const pyodidePromise = (async () => {
                    const py = await loadPyodide({
                        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/",
                    });
                    await py.loadPackage(['numpy', 'micropip', 'matplotlib', 'scipy']);
                    const plotUtilsCode = await plotUtilsFetch;
                    // Pin pypulseq for reproducible .seq format and API.
                    // deps=False: numpy already loaded; matplotlib/scipy loaded on demand — skips ~3s of transitive dep downloads.
                    await py.runPythonAsync(`
import micropip
await micropip.install('pypulseq==1.5.0.post1', deps=False)
`);
                    await patchSequencePlotFromCode(py, plotUtilsCode);
                    return py;
                })();

                // B. FAST PATH: show sidebar + main (Niivue) immediately
                const nvModule = new NiivueModule();
                nvModule.renderViewer('nv-viewer-container');
                nvModule.renderControls('nv-controls-container', true);

                const explorer = new SequenceExplorer(null, {
                    sources: [],
                    initialProt,
                    initialSeqUrl,
                    initialSeqParams,
                    onFunctionStart: () => {
                        if (window.viewManager) {
                            window.viewManager.setMode('sequence');
                        }
                    }
                });
                explorer._plotStackReady = pyodidePromise;
                explorer.renderTree('seq-tree-container');
                explorer.renderParams('seq-params-container');
                await explorer.renderPlot('seq-plot-container');

                const scanModule = new ScanModule();
                scanModule.render('scan-module-container');
                scanModule.prewarmToolBackends();

                const scanPreview = new ScanPreviewModule({ role: 'preview', labelDefault: 'Scan Preview' });
                scanPreview.render('nv-scan-preview-container');

                const scanCompare = new ComparePane();

                const mainHist = new MainHistogramController(nvModule);
                mainHist.attachToContainer(document.getElementById('nv-viewer-container'));
                const jointHist = new PreviewJointHistogramController();
                jointHist.attachToJointRow(document.getElementById('nv-joint-hist-row'));

                const configPromise = explorer.getDefaultSourcesConfig();

                const viewManager = new ViewManager(nvModule, explorer, scanModule, scanPreview);
                viewManager.setMode('planning');
                viewManager.bindViewModeButtons();

                // Shared-link gating: if a capsule/URL share is present, confirm before applying it.
                // Resolves the user's choice; must complete before loadSourcesFromConfig (import) runs.
                const sharedGateReady = (async () => {
                    let preview = null;
                    try {
                        preview = await explorer.previewSharedImport();
                    } catch (e) {
                        console.warn('previewSharedImport failed:', e);
                    }
                    if (!preview) return { accepted: false, preview: null };
                    let choice = 'default';
                    try {
                        choice = await explorer.showSharedImportDialog(preview);
                    } catch (e) {
                        console.warn('showSharedImportDialog failed:', e);
                    }
                    if (choice === 'shared') {
                        // URL-sourced meta is applied by selectInitialSequence via _pendingSharedSimMeta;
                        // capsule meta is read from the imported protocol's own [simulation] block.
                        if (preview.source === 'url' && preview.simMeta) {
                            explorer._pendingSharedSimMeta = preview.simMeta;
                        }
                        return { accepted: true, preview };
                    }
                    // Load default: ignore shared import AND the shared sequence/params in the URL.
                    explorer._skipSharedImport = true;
                    explorer.config.initialProt = undefined;
                    explorer.config.initialSeqParams = null;
                    return { accepted: false, preview };
                })();

                const mainViewerEl = document.getElementById('nv-viewer-container');
                if (mainViewerEl) mainViewerEl.classList.add('viewer-waiting-demo');
                // Wait for the gate so we don't load the default phantom then replace it with the shared one.
                const phantomReady = sharedGateReady.then(({ accepted, preview }) => {
                    if (accepted && preview?.phantom) {
                        // The shared phantom is loaded by selectInitialSequence (applySimulationStateFromMeta).
                        if (mainViewerEl) mainViewerEl.classList.remove('viewer-waiting-demo');
                        return;
                    }
                    return nvModule.loadDefaultCachePhantom().finally(() => {
                        if (mainViewerEl) mainViewerEl.classList.remove('viewer-waiting-demo');
                    });
                }).catch((err) => {
                    console.error('Default phantom load failed:', err);
                    if (mainViewerEl) mainViewerEl.classList.remove('viewer-waiting-demo');
                });

                window.viewManager = viewManager;
                window.nvModule = nvModule;
                window.seqExplorer = explorer;
                window.scanPreview = scanPreview;
                window.scanCompare = scanCompare;
                window.mainHist = mainHist;
                window.jointHist = jointHist;

                // Footer listeners (footer stays hidden until Pyodide ready)
                (function initFooterCardDots() {
                    const footer = document.getElementById('slot-footer');
                    const dots = document.getElementById('footer-card-dots');
                    if (!footer || !dots) return;
                    const tabEls = dots.querySelectorAll('.footer-card-tab[data-card]');
                    if (tabEls.length !== 3) return;
                    function isCompactLayout() {
                        return window.matchMedia('(max-width: 768px)').matches ||
                            document.querySelector('.lab-shell')?.classList.contains('compact-mode');
                    }
                    window.goToFooterCard = (cardIndex) => {
                        if (!isCompactLayout()) return;
                        const i = Math.max(0, Math.min(2, cardIndex));
                        const cardWidth = footer.scrollWidth / 3;
                        footer.scrollTo({ left: i * cardWidth, behavior: 'smooth' });
                    };
                    const updateActive = () => {
                        const cardWidth = footer.scrollWidth / 3;
                        const idx = Math.round(footer.scrollLeft / cardWidth);
                        const i = Math.max(0, Math.min(2, idx));
                        tabEls.forEach((el, k) => el.classList.toggle('active', k === i));
                    };
                    footer.addEventListener('scroll', updateActive, { passive: true });
                    updateActive();

                    tabEls.forEach((el, i) => {
                        el.addEventListener('click', () => {
                            if (!isCompactLayout()) return;
                            const cardWidth = footer.scrollWidth / 3;
                            footer.scrollTo({ left: i * cardWidth, behavior: 'smooth' });
                        });
                    });

                    let dotsStartX = 0;
                    dots.addEventListener('touchstart', (e) => {
                        if (!isCompactLayout()) return;
                        dotsStartX = e.touches[0].clientX;
                    }, { passive: true });
                    dots.addEventListener('touchend', (e) => {
                        if (!isCompactLayout()) return;
                        const endX = e.changedTouches[0].clientX;
                        const delta = dotsStartX - endX;
                        const cardWidth = footer.scrollWidth / 3;
                        if (delta > 40) {
                            const next = Math.min(2, Math.round(footer.scrollLeft / cardWidth) + 1);
                            footer.scrollTo({ left: next * cardWidth, behavior: 'smooth' });
                        } else if (delta < -40) {
                            const prev = Math.max(0, Math.round(footer.scrollLeft / cardWidth) - 1);
                            footer.scrollTo({ left: prev * cardWidth, behavior: 'smooth' });
                        }
                    }, { passive: true });
                })();

                // Start with sidebar collapsed on mobile
                (function initMobileSidebarCollapsed() {
                    if (!window.matchMedia('(max-width: 768px)').matches) return;
                    const labGrid = document.querySelector('.lab-grid');
                    const slotSidebar = document.getElementById('slot-sidebar');
                    const tabsContent = document.querySelector('.tabs-content');
                    const scansBtn = document.querySelector('.tab-btn[data-tab="scans"]');
                    if (labGrid && slotSidebar) {
                        labGrid.classList.add('sidebar-collapsed');
                        slotSidebar.classList.add('sidebar-collapsed');
                        if (tabsContent) tabsContent.classList.add('panel-collapsed');
                        if (scansBtn) {
                            scansBtn.textContent = scansBtn.dataset.collapsedLabel || 'S';
                        }
                    }
                })();

                // Swipe left on sidebar to collapse, swipe right to expand (mobile)
                (function initSidebarSwipe() {
                    const sidebar = document.getElementById('slot-sidebar');
                    if (!sidebar) return;
                    let startX = 0;
                    const threshold = 50;
                    sidebar.addEventListener('touchstart', (e) => {
                        if (!window.matchMedia('(max-width: 768px)').matches) return;
                        startX = e.touches[0].clientX;
                    }, { passive: true });
                    sidebar.addEventListener('touchend', (e) => {
                        if (!window.matchMedia('(max-width: 768px)').matches) return;
                        const endX = e.changedTouches[0].clientX;
                        const delta = startX - endX;
                        const btn = sidebar.querySelector('.tab-btn[data-tab="scans"]');
                        const labGrid = sidebar.closest('.lab-grid');
                        const tabsContent = sidebar.querySelector('.tabs-content');
                        if (!btn || !labGrid || !btn.classList.contains('active')) return;
                        if (delta > threshold) {
                            if (!labGrid.classList.contains('sidebar-collapsed')) {
                                labGrid.classList.add('sidebar-collapsed');
                                sidebar.classList.add('sidebar-collapsed');
                                if (tabsContent) tabsContent.classList.add('panel-collapsed');
                                btn.textContent = btn.dataset.collapsedLabel || 'S';
                            }
                        } else if (delta < -threshold) {
                            if (labGrid.classList.contains('sidebar-collapsed')) {
                                labGrid.classList.remove('sidebar-collapsed');
                                sidebar.classList.remove('sidebar-collapsed');
                                if (tabsContent) tabsContent.classList.remove('panel-collapsed');
                                btn.textContent = btn.dataset.fullLabel || 'SCANS';
                            }
                        }
                    }, { passive: true });
                })();

                // C. WHEN PYODIDE IS READY: finish setup, then hide loader and show footer
                function hideLoaderAndShowFooter() {
                    const loaderEl = document.getElementById('loader');
                    const footerWrapper = document.querySelector('.footer-wrapper');
                    if (loaderEl) loaderEl.classList.add('hidden');
                    if (footerWrapper) footerWrapper.classList.remove('footer-pending');
                }

                pyodidePromise.then(async (pyodide) => {
                    nvModule.pyodide = pyodide;
                    explorer.config.pyodide = pyodide;
                    const configCode = await configPromise;
                    // Ensure the shared-link decision (skip/import + pending meta) is settled before
                    // loadSourcesFromConfig triggers importSharedProtocolFromLocation / selectInitialSequence.
                    await sharedGateReady;
                    await Promise.all([
                        nvModule.initPyodide(),
                        explorer.loadSourcesFromConfig(configCode),
                    ]);
                    if (nvModule._pendingPhantomVfs) {
                        const { jsonFile, jsonFiles, niftiFiles } = nvModule._pendingPhantomVfs;
                        try {
                            // Write all JSON configs (multi-config phantoms) so the config selector lists them.
                            await nvModule.populatePyodideVFS(niftiFiles, jsonFiles && jsonFiles.length ? jsonFiles : [jsonFile]);
                        } catch (err) {
                            console.warn('Sync default phantom to Pyodide VFS failed:', err);
                        }
                        nvModule._pendingPhantomVfs = null;
                    }
                    nvModule.updateJsonTab();
                    hideLoaderAndShowFooter();
                    // Default phantom fetch/render may still finish in background
                    phantomReady.catch(() => {});
                }).catch(async (e) => {
                    console.error("Pyodide/background setup failed:", e);
                    hideLoaderAndShowFooter();
                });

            } catch (e) {
                console.error("Bootstrap failed:", e);
            }
        }

        bootstrap();

        // Credits popup
        (function () {
            const btn = document.getElementById('credits-btn');
            const overlay = document.getElementById('credits-overlay');
            const content = document.getElementById('credits-content');
            const closeBtn = document.getElementById('credits-close');

            async function openCredits() {
                overlay.hidden = false;
                content.textContent = 'Loading…';
                try {
                    const res = await fetch('credits.md');
                    const text = await res.text();
                    const { marked } = await import('https://esm.run/marked@12.0.0');
                    content.innerHTML = marked.parse(text);
                } catch (e) {
                    content.textContent = 'Could not load credits. ' + (e && e.message ? e.message : '');
                }
            }

            function closeCredits() {
                overlay.hidden = true;
            }

            if (btn) btn.addEventListener('click', openCredits);
            if (closeBtn) closeBtn.addEventListener('click', closeCredits);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCredits(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeCredits(); });
        })();

        // Info popup
        (function () {
            const btn = document.getElementById('info-btn');
            const overlay = document.getElementById('info-overlay');
            const content = document.getElementById('info-content');
            const closeBtn = document.getElementById('info-close');

            async function openInfo() {
                overlay.hidden = false;
                content.textContent = 'Loading…';
                try {
                    const res = await fetch('info.md');
                    const text = await res.text();
                    const { marked } = await import('https://esm.run/marked@12.0.0');
                    content.innerHTML = marked.parse(text);
                } catch (e) {
                    content.textContent = 'Could not load info. ' + (e && e.message ? e.message : '');
                }
            }

            function closeInfo() {
                overlay.hidden = true;
            }

            if (btn) btn.addEventListener('click', openInfo);
            if (closeBtn) closeBtn.addEventListener('click', closeInfo);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeInfo(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeInfo(); });
        })();
    </script>
</body>
</html>
