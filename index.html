<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Any-Field Scanner</title>
    
    <!-- Dependencies for Niivue App -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
    
    <!-- CSS Loading Order: Base styles first, then modules, then master override -->
    <link rel="stylesheet" href="startup.css">
    <link rel="stylesheet" href="niivue_app.css?v=5">
    <link rel="stylesheet" href="pypulseq/seq_explorer.css">
    <link rel="stylesheet" href="scan_zero/scan_module.css?v=8">
    <link rel="stylesheet" href="no_field.css"> <!-- Master override LAST -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Dependencies for Seq Explorer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>

    <style>
        :root {
            /* Unified color system - single background hierarchy */
            --bg: #0a0e1a;              /* Base background - darkest */
            --bg-elevated: #0f1424;     /* Slightly elevated surfaces */
            --bg-panel: #141b2d;        /* Panel/card background */
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text: #e8ecff;
            --muted: #a9b3da;
            --sidebar-width: 260px;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        
        .lab-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            justify-content: space-between;
        }

        .lab-grid {
            flex: 1;
            display: grid;
            grid-template-areas:
                "sidebar main"
                "footer footer";
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 1fr 320px;
            overflow: hidden;
            position: relative;
        }
        /* Loader overlays right side of main (B, and B+C when compare pane active) */
        .loading-overlay.main-area-loader {
            grid-area: main;
            position: absolute;
            left: 50%;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
        }
        #slot-main.has-compare-pane .loading-overlay.main-area-loader {
            left: 33.33%;
        }
        #nv-preview-bc-stack {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }
        #nv-preview-bc-canvas-row {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: row;
        }
        #nv-preview-bc-canvas-row > .niivue-app {
            flex: 1;
            min-width: 0;
            min-height: 0;
        }
        #nv-joint-hist-row {
            flex: 0 0 auto;
        }
        #nv-compare-container {
            flex: 1;
            min-width: 0;
            min-height: 0;
            border-left: 1px solid var(--border);
            flex-direction: column;
        }
        #nv-compare-container.compare-pane-hidden {
            display: none !important;
        }
        #slot-main > .niivue-app,
        #slot-main > #nv-preview-bc-stack {
            min-width: 0;
        }
        #slot-main:not(.planning-hist-visible) .clim-hist-panel,
        #slot-main:not(.planning-hist-visible) #nv-joint-hist-row {
            display: none !important;
        }
        .footer-wrapper.footer-pending {
            display: none !important;
        }
        #nv-viewer-container.viewer-waiting-demo {
            visibility: hidden;
        }
        .lab-grid.sidebar-collapsed {
            grid-template-columns: 30px 1fr;
        }

        #slot-sidebar { 
            grid-area: sidebar; 
            border-right: 1px solid var(--border); 
            border-bottom: 1px solid var(--border); 
            overflow-y: auto; 
            background: var(--bg-elevated); 
        }
        #slot-sidebar.sidebar-collapsed {
            min-width: 0;
            width: 100%;
            overflow: hidden;
        }
        #slot-sidebar.sidebar-collapsed .tabs-header {
            flex-direction: column;
            flex-wrap: nowrap;
        }
        #slot-sidebar.sidebar-collapsed .tab-btn {
            flex: 0 0 auto;
            min-height: 34px;
        }
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="phantoms"],
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="view"],
        #slot-sidebar.sidebar-collapsed .tab-btn[data-tab="fov"] {
            display: none;
        }
        #slot-main { 
            grid-area: main; 
            border-bottom: 1px solid var(--border); 
            overflow: hidden; 
            position: relative; 
            background: var(--bg);
        }
        #slot-main.scrollable { overflow-y: auto; }
        
        .footer-wrapper {
            grid-area: footer;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .footer-wrapper .footer-card-dots { display: none; }
        #slot-footer { 
            flex: 1;
            min-height: 0;
            display: grid; 
            grid-template-columns: 1fr 0.8fr 1.5fr; 
            gap: 1px; 
            background: var(--border); 
            overflow: hidden; 
        }
        .footer-col { 
            background: var(--bg-elevated); 
            overflow-y: auto; 
            padding: 12px; 
            position: relative; 
        }

        /* Tab Styles for Sidebar */
        .tabbed-controls {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .tabs-header {
            display: flex;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            background: var(--bg-elevated);
        }
        .tabs-content {
            flex: 1;
            overflow: hidden;
            padding: 2px;
            display: flex;
            flex-direction: column;
            background: var(--bg-elevated);
        }
        .tabs-content.panel-collapsed {
            display: none !important;
        }
        .tab-pane {
            display: none;
            height: 100%;
            overflow: hidden;
        }
        .tab-pane.active {
            display: flex;
            flex-direction: column;
        }

        /* Module Styles Override */
        .niivue-app, .standalone-viewer, .standalone-controls {
            height: 100% !important;
            width: 100% !important;
            background: transparent !important;
        }
        .seq-plot-container {
            height: 100% !important;
            background: var(--bg) !important;
        }
        #slot-footer .seq-explorer, #slot-footer .scan-module {
            height: 100%;
            background: transparent;
        }
    </style>
    <link rel="stylesheet" href="no_field_mobile.css" media="(max-width: 768px)">
</head>
<body>
    <div class="lab-shell">
        <header>
            <div class="header-content">
                <div class="header-title">Any-Field <span class="header-subtitle">Scanner</span><span class="app-version" aria-label="Version v4.1.0">v4.1.0</span></div>
                <div class="header-actions">
                    <div class="header-view-modes" role="group" aria-label="Main view mode">
                        <button type="button" id="view-mode-planning-btn" class="credits-btn view-mode-btn" title="Planning view (main + preview)" aria-label="Planning view, main and preview">
                            <svg class="view-mode-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3" width="6" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="3" width="6" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
                        </button>
                        <button type="button" id="view-mode-compare-btn" class="credits-btn view-mode-btn" title="Planning view with compare pane (A + B + C)" aria-label="Planning view with compare pane">
                            <svg class="view-mode-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="3" width="4" height="10" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="6" y="3" width="4" height="10" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="11.5" y="3" width="4" height="10" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
                        </button>
                        <button type="button" id="view-mode-sequence-btn" class="credits-btn view-mode-btn" title="Sequence plot view" aria-label="Sequence plot view">
                            <svg class="view-mode-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8 C3.5 4.5 5.5 11.5 8 8 S12.5 4.5 14.5 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                    <button type="button" id="paper-plot-btn" class="credits-btn paper-plot-launch-btn" title="Paper plot figure builder"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i></button>
                    <button type="button" id="credits-btn" class="credits-btn" title="Credits &amp; dependencies"><i class="bi bi-award" aria-hidden="true"></i></button>
                    <a id="github-btn" class="credits-btn" href="https://github.com/mrx-org/anyfield" target="_blank" rel="noopener noreferrer" title="GitHub repository" aria-label="GitHub repository"><i class="bi bi-github" aria-hidden="true"></i></a>
                    <button type="button" id="info-btn" class="credits-btn" title="Info &amp; legal notice"><i class="bi bi-info-circle" aria-hidden="true"></i></button>
                </div>
            </div>
        </header>
        <div id="credits-overlay" class="credits-overlay" hidden>
            <div class="credits-modal">
                <div class="credits-modal-header">
                    <h2 class="credits-modal-title">Credits</h2>
                    <button type="button" id="credits-close" class="credits-close" title="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
                </div>
                <div id="credits-content" class="credits-content">Loading…</div>
            </div>
        </div>
        <div id="info-overlay" class="credits-overlay" hidden>
            <div class="credits-modal">
                <div class="credits-modal-header">
                    <h2 class="credits-modal-title">Info</h2>
                    <button type="button" id="info-close" class="credits-close" title="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
                </div>
                <div id="info-content" class="credits-content">Loading…</div>
            </div>
        </div>
        
        <div class="lab-grid">
            <div id="slot-sidebar"></div>
            <div id="slot-main"></div>
            <div id="loader" class="loading-overlay main-area-loader" aria-hidden="true">
                <div class="scene">
                    <div class="shadow-nucleus"></div>
                    <div class="shadow-floor">
                        <div class="shadow-rotator">
                            <div class="shadow-bar">
                                <div class="shadow-head"></div>
                            </div>
                        </div>
                    </div>
                    <div class="nucleus"></div>
                    <div class="z-controller">
                        <div class="arrow-pivot">
                            <div class="stick-wrapper">
                                <div class="shaft"></div>
                                <div class="head"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="loader-text" class="loader-text"></div>
                <div class="loader-progress" aria-hidden="true">
                    <div class="loader-progress-track"><div class="loader-progress-fill"></div></div>
                    <div class="loader-progress-label"></div>
                </div>
            </div>
            <div class="footer-wrapper footer-pending">
                <div class="footer-card-dots" id="footer-card-dots" aria-hidden="true">
                    <span class="footer-card-tab" data-card="0">seq</span>
                    <span class="footer-card-dot-sep" aria-hidden="true">•</span>
                    <span class="footer-card-tab" data-card="1">prot</span>
                    <span class="footer-card-dot-sep" aria-hidden="true">•</span>
                    <span class="footer-card-tab" data-card="2">scans</span>
                </div>
                <div id="slot-footer">
                    <div id="col-tree" class="footer-col"></div>
                    <div id="col-scan" class="footer-col"></div>
                    <div id="col-params" class="footer-col"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden cache for modules when they are not in a slot -->
    <div id="module-cache" style="display: none;">
        <div id="nv-viewer-container" class="niivue-app viewer-column-stack"></div>
        <div id="nv-preview-bc-stack" class="nv-preview-bc-stack">
            <div id="nv-preview-bc-canvas-row" class="nv-preview-bc-canvas-row">
                <div id="nv-scan-preview-container" class="niivue-app viewer-column-stack"></div>
                <div id="nv-compare-container" class="niivue-app compare-pane-hidden viewer-column-stack"></div>
            </div>
            <div id="nv-joint-hist-row" class="nv-joint-hist-row"></div>
        </div>
        <div id="nv-controls-container" class="niivue-app"></div>
        <div id="seq-tree-container" class="seq-explorer"></div>
        <div id="seq-params-container" class="seq-explorer"></div>
        <div id="seq-plot-container" class="seq-explorer"></div>
        <div id="scan-module-container" class="scan-module"></div>
    </div>

    <script type="module" src="paper_plot/launch.js?v=11"></script>
    <script type="module">
        import { bootstrap } from './app_bootstrap.js';

        bootstrap();

        // Credits popup
        (function () {
            const btn = document.getElementById('credits-btn');
            const overlay = document.getElementById('credits-overlay');
            const content = document.getElementById('credits-content');
            const closeBtn = document.getElementById('credits-close');

            async function openCredits() {
                overlay.hidden = false;
                content.textContent = 'Loading…';
                try {
                    const res = await fetch('credits.md');
                    const text = await res.text();
                    const { marked } = await import('https://esm.run/marked@12.0.0');
                    content.innerHTML = marked.parse(text);
                } catch (e) {
                    content.textContent = 'Could not load credits. ' + (e && e.message ? e.message : '');
                }
            }

            function closeCredits() {
                overlay.hidden = true;
            }

            if (btn) btn.addEventListener('click', openCredits);
            if (closeBtn) closeBtn.addEventListener('click', closeCredits);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCredits(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeCredits(); });
        })();

        // Info popup
        (function () {
            const btn = document.getElementById('info-btn');
            const overlay = document.getElementById('info-overlay');
            const content = document.getElementById('info-content');
            const closeBtn = document.getElementById('info-close');

            async function openInfo() {
                overlay.hidden = false;
                content.textContent = 'Loading…';
                try {
                    const res = await fetch('info.md');
                    const text = await res.text();
                    const { marked } = await import('https://esm.run/marked@12.0.0');
                    content.innerHTML = marked.parse(text);
                } catch (e) {
                    content.textContent = 'Could not load info. ' + (e && e.message ? e.message : '');
                }
            }

            function closeInfo() {
                overlay.hidden = true;
            }

            if (btn) btn.addEventListener('click', openInfo);
            if (closeBtn) closeBtn.addEventListener('click', closeInfo);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeInfo(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeInfo(); });
        })();
    </script>
</body>
</html>
